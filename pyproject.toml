[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automator"
version = "1.0.1"
description = "Automator: clasificador y archivador automatico de facturas AFIP con interfaz de escritorio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brian Rey" }]
keywords = ["automator", "facturas", "afip", "pdf", "watcher", "desktop"]

# CustomTkinter es Tkinter puro por debajo (sin binarios pesados): interfaz
# moderna, funciona en cualquier PC con Python y empaqueta limpio a .exe.
dependencies = [
    "pypdf>=4.2",
    "watchdog>=4.0",
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "customtkinter>=5.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.6",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.gui-scripts]
automator = "automator.ui.app:main"

[project.scripts]
automator-cli = "automator.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["automator"]
omit = ["*/ui/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I isort, N naming, UP pyupgrade, B bugbear,
# SIM simplify, RUF ruff, BLE blind-except, C4 comprehensions, PIE, PT pytest,
# RET returns, ISC string-concat, A builtins, TID tidy-imports, FA future-annos, PGH.
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE",
    "C4", "PIE", "PT", "RET", "ISC", "A", "TID", "FA", "PGH",
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Los tests acceden a internals a proposito y no necesitan las mismas reglas.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["automator"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/automator"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["watchdog.*", "pypdf.*", "customtkinter.*", "openpyxl.*"]
ignore_missing_imports = true

# CustomTkinter no publica stubs; se permite heredar de sus clases en la capa de UI.
[[tool.mypy.overrides]]
module = ["automator.ui.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
