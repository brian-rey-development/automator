[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automator"
version = "1.1.0"
description = "Automator: clasificador y archivador automatico de facturas AFIP con interfaz de escritorio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brian Rey" }]
keywords = ["automator", "facturas", "afip", "pdf", "watcher", "desktop"]

# CustomTkinter es Tkinter puro por debajo (sin binarios pesados): interfaz
# moderna, funciona en cualquier PC con Python y empaqueta limpio a .exe.
dependencies = [
    "pypdf>=4.2",
    "watchdog>=4.0",
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "customtkinter>=5.2",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "zxing-cpp>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.1",
    "pyinstaller>=6.6",
    "reportlab>=4.0",
]

[project.gui-scripts]
automator = "automator.ui.app:main"

[project.scripts]
automator-cli = "automator.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=30"
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["automator"]
omit = ["*/ui/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE",
    "C4", "PIE", "PT", "RET", "ISC", "A", "TID", "FA", "PGH",
    "C90", "PLR",
]
ignore = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 20
max-branches = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0915"]
"scripts/**" = ["PLR2004", "PLR0913", "PLR0917"]
"src/automator/ui/**" = ["PLR0915", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0917"]
"src/automator/services/processing/processor.py" = ["PLR0915", "C901", "PLR0911", "PLR0912"]

[tool.ruff.lint.isort]
known-first-party = ["automator"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/automator"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["watchdog.*", "pypdf.*", "customtkinter.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["automator.ui.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.importlinter]
root_packages = ["automator"]

[[tool.importlinter.contracts]]
name = "Clean layers"
type = "layers"
layers = [
    "automator.ui",
    "automator.services",
    "automator.domain",
]

[[tool.importlinter.contracts]]
name = "Domain does not import config"
type = "forbidden"
source_modules = ["automator.domain"]
forbidden_modules = ["automator.config"]

[[tool.importlinter.contracts]]
name = "Config does not import services"
type = "forbidden"
source_modules = ["automator.config"]
forbidden_modules = ["automator.services"]
